plugins {
    id 'com.android.application'
}

android {
    namespace 'com.carlink.headunit'
    compileSdk 34

    defaultConfig {
        applicationId 'com.carlink.headunit'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No dependencies on purpose: framework APIs only (no AndroidX, no third-party libs).
dependencies {
}
